<!DOCTYPE html>
<html lang="en" data-zero-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZERO — StudioCLI</title>
<style>
/* ════════════════ ZERO · Minimal Mono (light + dark) ════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --rail:64px; --side:288px; --maxw:720px;
  --r:18px; --r-sm:12px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --accent:#22d3ee;
}
[data-zero-theme="dark"]{
  --bg:#0a0a0b; --bg2:#0e0e10; --panel:#141416; --panel2:#1a1a1d;
  --ink:#ededee; --ink2:#a1a1a8; --ink3:#6b6b73;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --hover:rgba(255,255,255,.05); --shadow:0 16px 50px rgba(0,0,0,.55);
  --bubble:rgba(255,255,255,.035);
}
[data-zero-theme="light"]{
  --bg:#faf9f7; --bg2:#f3f1ed; --panel:#ffffff; --panel2:#f6f5f2;
  --ink:#16161a; --ink2:#5b5b63; --ink3:#9a9aa2;
  --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.14);
  --hover:rgba(0,0,0,.045); --shadow:0 16px 50px rgba(0,0,0,.12);
  --bubble:rgba(0,0,0,.028);
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}

/* ── icon rail + expanding sidebar ─────────────────────────────────── */
.zside{position:fixed;top:0;left:0;height:100%;width:var(--rail);z-index:30;
  background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:stretch;
  transition:width .22s cubic-bezier(.4,0,.2,1);overflow:hidden}
.zside:hover,.zside.pin{width:var(--side);box-shadow:var(--shadow)}
.zside-top{display:flex;align-items:center;gap:10px;height:60px;padding:0 16px;flex-shrink:0}
.zmark{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;letter-spacing:-1px}
.zmark-txt{font-weight:700;letter-spacing:.5px;white-space:nowrap;opacity:0;transition:opacity .18s .05s}
.zside:hover .zmark-txt,.zside.pin .zmark-txt{opacity:1}
.znav{padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.znav button{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;
  color:var(--ink2);cursor:pointer;padding:10px;border-radius:10px;font:inherit;font-size:14px;white-space:nowrap}
.znav button:hover{background:var(--hover);color:var(--ink)}
.znav svg{width:18px;height:18px;flex-shrink:0;stroke-width:1.8}
.znav .lbl{opacity:0;transition:opacity .18s}
.zside:hover .lbl,.zside.pin .lbl{opacity:1}
.zconvos{flex:1;overflow-y:auto;padding:6px 12px 12px;opacity:0;transition:opacity .18s}
.zside:hover .zconvos,.zside.pin .zconvos{opacity:1}
.zconvos::-webkit-scrollbar{width:0}
.zsec{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);padding:12px 10px 6px;white-space:nowrap}
.zconvo{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;cursor:pointer;
  color:var(--ink2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zconvo:hover{background:var(--hover);color:var(--ink)}
.zconvo.active{background:var(--hover);color:var(--ink)}
.zconvo .x{margin-left:auto;opacity:0;color:var(--ink3);font-size:16px;line-height:1}
.zconvo:hover .x{opacity:1}
.zside-foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:2px;flex-direction:column}

/* ── main ──────────────────────────────────────────────────────────── */
.zmain{margin-left:var(--rail);height:100%;display:flex;flex-direction:column}
.ztop{height:60px;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 22px;
  border-bottom:1px solid transparent}
.zghost{background:none;border:1px solid var(--line2);color:var(--ink2);cursor:pointer;
  border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;display:flex;align-items:center;gap:7px}
.zghost:hover{color:var(--ink);border-color:var(--ink2)}
.zghost svg{width:15px;height:15px;stroke-width:1.8}

.zscroll{flex:1;overflow-y:auto}
.zscroll::-webkit-scrollbar{width:8px}
.zscroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.zfeed{max-width:var(--maxw);margin:0 auto;padding:30px 24px 160px}

/* empty state */
.zhero{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.zhero h1{font-size:34px;font-weight:700;letter-spacing:-1px}
.zhero p{color:var(--ink2);font-size:15px}
.zchips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px;max-width:520px}
.zchip{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 15px;
  cursor:pointer;font-size:13.5px;color:var(--ink2);text-align:left;transition:.15s}
.zchip:hover{border-color:var(--line2);color:var(--ink);transform:translateY(-1px)}

/* messages */
.zmsg{margin:26px 0;display:flex;flex-direction:column;gap:7px;animation:zin .3s ease}
@keyframes zin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.zrole{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);font-weight:600}
.zmsg.user .zbody{background:var(--bubble);border:1px solid var(--line);border-radius:16px;padding:13px 17px;align-self:flex-start;max-width:100%}
.zbody{font-size:15px;color:var(--ink);word-wrap:break-word}
.zbody p{margin:0 0 10px}.zbody p:last-child{margin:0}
.zbody pre{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;overflow:auto;margin:10px 0}
.zbody code{font-family:var(--mono);font-size:13px}
.zbody :not(pre)>code{background:var(--bubble);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.zbody ul,.zbody ol{margin:6px 0 12px;padding-left:22px}
.zbody h1,.zbody h2,.zbody h3{margin:14px 0 8px;line-height:1.3}
.zbody a{color:var(--accent)}
.zdots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink3);margin-right:4px;animation:zb 1s infinite}
.zdots span:nth-child(2){animation-delay:.15s}.zdots span:nth-child(3){animation-delay:.3s}
@keyframes zb{0%,60%,100%{opacity:.25}30%{opacity:1}}
.zerr{color:#f87171}
.zacts{display:flex;gap:4px;margin-top:4px;opacity:0;transition:opacity .15s}
.zmsg:hover .zacts{opacity:1}
.zacts button{background:none;border:0;color:var(--ink3);cursor:pointer;font:inherit;font-size:12px;
  padding:3px 8px;border-radius:7px}
.zacts button:hover{background:var(--hover);color:var(--ink)}
body.zcompact .zmsg{margin:14px 0}
body.zlarge .zbody{font-size:17px}
.zpop{position:fixed;left:70px;bottom:64px;z-index:50;background:var(--panel);border:1px solid var(--line2);
  border-radius:14px;box-shadow:var(--shadow);padding:10px;min-width:220px;display:none}
.zpop.on{display:block}
.zpop .zflag{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;
  border-radius:9px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.zpop .zflag:hover{background:var(--hover);color:var(--ink)}
.zsw{width:34px;height:20px;border-radius:11px;background:var(--line2);position:relative;flex-shrink:0;transition:.15s}
.zsw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink2);transition:.15s}
.zflag.on .zsw{background:var(--ink)}
.zflag.on .zsw::after{left:16px;background:var(--bg)}
.zpop .ztitle{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);padding:4px 10px 6px}

/* composer */
.zcomp-wrap{position:absolute;bottom:0;left:var(--rail);right:0;padding:18px 24px 26px;
  background:linear-gradient(to top,var(--bg) 55%,transparent);pointer-events:none}
.zcomp{max-width:var(--maxw);margin:0 auto;pointer-events:auto;
  background:var(--panel);border:1px solid var(--line2);border-radius:26px;
  box-shadow:var(--shadow);padding:8px 8px 8px 20px;display:flex;align-items:flex-end;gap:10px;
  transition:border-color .15s}
.zcomp:focus-within{border-color:var(--ink2)}
.zcomp textarea{flex:1;background:none;border:0;outline:0;resize:none;color:var(--ink);
  font:inherit;font-size:15px;line-height:1.5;max-height:180px;padding:9px 0}
.zcomp textarea::placeholder{color:var(--ink3)}
.zsend{width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;flex-shrink:0;
  background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;transition:.15s}
.zsend:disabled{opacity:.3;cursor:default}
.zsend:not(:disabled):hover{transform:scale(1.06)}
.zsend svg{width:17px;height:17px}
.zhint{text-align:center;font-size:11px;color:var(--ink3);margin-top:9px;pointer-events:none}

@media(max-width:640px){
  .zside{width:0;border:0}.zside.pin{width:var(--side)}
  .zmain{margin-left:0}.zcomp-wrap{left:0}
  .zmobtn{display:flex!important}
}
.zmobtn{display:none}

/* gate notice */
.zgate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;padding:24px}
.zgate-box{max-width:460px;text-align:center;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:40px 32px}
.zgate input{width:200px;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;
  color:var(--ink);padding:11px 13px;font:inherit;outline:0}
.zgate button{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<script>
/* ── Internal-tester gate (email allowlist OR access code) ─────────────── */
(function(){
  var ALLOW=["jasminefoxx799@gmail.com","studio@foxxia.dev"];
  var CODE="ZERO-2026";
  var email=(localStorage.getItem("studioEmail")||"").trim().toLowerCase();
  var qp=new URLSearchParams(location.search).get("code");
  if(qp && qp===CODE) localStorage.setItem("zeroAccess","1");
  window.ZERO_OK = ALLOW.indexOf(email)>=0 || localStorage.getItem("zeroAccess")==="1";
})();
</script>

<!-- Sidebar -->
<aside class="zside" id="zside">
  <div class="zside-top">
    <div class="zmark">0</div><span class="zmark-txt">ZERO</span>
  </div>
  <nav class="znav">
    <button onclick="zNew()" title="New chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span class="lbl">New chat</span></button>
    <button onclick="zToggleTheme()" title="Toggle light/dark" id="zThemeBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="lbl" id="zThemeLbl">Light mode</span></button>
    <button onclick="zToggleFlags()" title="Internal flags">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      <span class="lbl">Flags</span></button>
    <button onclick="location.href='/inbox.html'" title="Inbox (internal)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      <span class="lbl">Inbox</span></button>
    <button onclick="location.href='/index.html'" title="Back to Studio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span class="lbl">Back to Studio</span></button>
  </nav>
  <div class="zconvos" id="zConvos"></div>
  <div class="zside-foot">
    <button onclick="zPin()" class="znav" style="display:flex;align-items:center;gap:14px;background:none;border:0;color:var(--ink3);cursor:pointer;padding:10px;border-radius:10px" title="Pin sidebar">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="3" y1="12" x2="21" y2="12"/><polyline points="9 6 15 12 9 18"/></svg>
      <span class="lbl">Pin</span></button>
  </div>
  <div class="zpop" id="zPop"></div>
</aside>

<!-- Main -->
<main class="zmain">
  <div class="ztop">
    <button class="zghost zmobtn" onclick="zPin()">☰</button>
    <span style="margin-right:auto;font-size:12px;letter-spacing:1px;color:var(--ink3);text-transform:uppercase">ZERO · internal beta</span>
    <button class="zghost" onclick="zToggleTheme()" id="zTopTheme">Light</button>
  </div>
  <div class="zscroll" id="zScroll">
    <div class="zfeed" id="zFeed"></div>
  </div>
  <div class="zcomp-wrap">
    <div class="zcomp">
      <textarea id="zInput" rows="1" placeholder="Ask anything…"></textarea>
      <button class="zsend" id="zSend" disabled onclick="zSendMsg()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3 10l12 2-12 2z"/></svg>
      </button>
    </div>
    <div class="zhint">ZERO is an internal experimental UI · Enter to send · Shift+Enter for newline</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>
/* ════════════════ ZERO app ════════════════ */
if(!window.ZERO_OK){
  document.body.innerHTML='<div class="zgate"><div class="zgate-box">'
    +'<div style="font-size:30px;margin-bottom:10px">⬡</div>'
    +'<h2 style="margin-bottom:10px;font-size:20px">ZERO is invite-only</h2>'
    +'<p style="color:var(--ink2);margin-bottom:18px;font-size:14px">The new experimental UI is limited to internal testers. '
    +'Have an access code? Type it below, or request access at <a style="color:var(--accent)" href="mailto:studio@foxxia.dev">studio@foxxia.dev</a>.</p>'
    +'<div style="display:flex;gap:8px;justify-content:center"><input id="zCode" placeholder="Access code"><button id="zEnter" type="button">Unlock</button></div>'
    +'<div id="zCodeErr" style="color:#f87171;font-size:13px;min-height:18px;margin-top:10px"></div>'
    +'<a href="/index.html" style="color:var(--ink3);font-size:13px">← Back to Studio</a></div></div>';
  var tryCode=function(){var v=(document.getElementById("zCode").value||"").trim();
    if(v==="ZERO-2026"){localStorage.setItem("zeroAccess","1");location.reload();}
    else document.getElementById("zCodeErr").textContent="Invalid code.";};
  window.zCheck=tryCode;
  document.getElementById("zEnter").addEventListener("click",tryCode);
  document.getElementById("zCode").addEventListener("keydown",function(e){if(e.key==="Enter")tryCode();});
}else{ (function(){
  "use strict";
  var ZK="zeroConvos", model="", convo=null, busy=false;

  // theme
  function applyTheme(t){document.documentElement.setAttribute("data-zero-theme",t);
    localStorage.setItem("zeroTheme",t);
    var light=t==="light";
    var lbl=document.getElementById("zThemeLbl"); if(lbl)lbl.textContent=light?"Dark mode":"Light mode";
    var tt=document.getElementById("zTopTheme"); if(tt)tt.textContent=light?"Dark":"Light";}
  window.zToggleTheme=function(){applyTheme(document.documentElement.getAttribute("data-zero-theme")==="light"?"dark":"light");};
  applyTheme(localStorage.getItem("zeroTheme")||"dark");

  window.zPin=function(){document.getElementById("zside").classList.toggle("pin");};

  // storage
  function load(){try{return JSON.parse(localStorage.getItem(ZK)||"[]");}catch(e){return [];}}
  function save(list){localStorage.setItem(ZK,JSON.stringify(list.slice(0,50)));}
  function convos(){return load();}
  function persist(){var list=load();var i=list.findIndex(c=>c.id===convo.id);
    if(i>=0)list[i]=convo; else list.unshift(convo); save(list); renderSide();}

  function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
  function mdRender(t){try{if(window.marked){var h=marked.parse(t);return window.DOMPurify?DOMPurify.sanitize(h):h;}}catch(e){}return esc(t);}

  function newConvo(){return {id:"z"+Date.now().toString(36),title:"New chat",messages:[],ts:Date.now()};}
  window.zNew=function(){convo=newConvo();renderFeed();renderSide();document.getElementById("zInput").focus();};

  function renderSide(){
    var box=document.getElementById("zConvos"); var list=convos();
    box.innerHTML='<div class="zsec">Conversations</div>'+(list.length?list.map(c=>
      '<div class="zconvo'+(convo&&c.id===convo.id?' active':'')+'" onclick="zOpen(\''+c.id+'\')">'
      +'<span style="overflow:hidden;text-overflow:ellipsis">'+esc(c.title||"Untitled")+'</span>'
      +'<span class="x" onclick="event.stopPropagation();zDel(\''+c.id+'\')">×</span></div>').join("")
      :'<div style="color:var(--ink3);font-size:13px;padding:8px 10px">No chats yet</div>');
  }
  window.zOpen=function(id){var c=convos().find(x=>x.id===id);if(c){convo=c;renderFeed();renderSide();}};
  window.zDel=function(id){var list=convos().filter(c=>c.id!==id);save(list);
    if(convo&&convo.id===id)convo=newConvo(); renderFeed();renderSide();};

  function renderFeed(){
    var feed=document.getElementById("zFeed");
    if(!convo||!convo.messages.length){
      feed.innerHTML='<div class="zhero"><div class="zmark" style="width:46px;height:46px;font-size:20px;border-radius:13px;margin-bottom:6px">0</div>'
        +'<h1>ZERO</h1><p>A quieter way to think out loud.</p>'
        +'<div class="zchips">'
        +['Explain a tricky concept simply','Refactor this function for clarity','Draft a commit message','Brainstorm names for a project']
          .map(s=>'<div class="zchip" onclick="zChip(this)">'+s+'</div>').join("")
        +'</div></div>';
      return;
    }
    feed.innerHTML=convo.messages.map(function(m,i){
      var body=(m.role==="user")?esc(m.content).replace(/\n/g,"<br>"):mdRender(m.content);
      var last=i===convo.messages.length-1;
      var acts=(m.role==="user")
        ? '<button onclick="zEditMsg('+i+')">Edit</button><button onclick="zDelMsg('+i+')">Delete</button>'
        : '<button onclick="zCopy('+i+')">Copy</button>'+(last?'<button onclick="zRegen()">Regenerate</button>':'');
      return '<div class="zmsg '+m.role+'"><div class="zrole">'+(m.role==="user"?"You":"ZERO")+'</div>'
        +'<div class="zbody">'+body+'</div><div class="zacts">'+acts+'</div></div>';
    }).join("");
    scrollDown();
  }
  window.zChip=function(el){var inp=document.getElementById("zInput");inp.value=el.textContent;inp.dispatchEvent(new Event("input"));zSendMsg();};

  // message actions
  window.zCopy=function(i){var m=convo.messages[i];if(!m)return;
    (navigator.clipboard?navigator.clipboard.writeText(m.content):Promise.reject()).then(
      function(){flash("Copied");},function(){flash("Clipboard unavailable");});};
  window.zDelMsg=function(i){if(busy)return;convo.messages.splice(i,1);persist();renderFeed();};
  window.zEditMsg=function(i){var m=convo.messages[i];if(!m||busy)return;
    var inp=document.getElementById("zInput");inp.value=m.content;inp.dispatchEvent(new Event("input"));inp.focus();
    convo.messages.splice(i);persist();renderFeed();};
  window.zRegen=function(){if(busy||!convo.messages.length)return;
    if(convo.messages[convo.messages.length-1].role==="assistant")convo.messages.pop();
    var last=convo.messages[convo.messages.length-1];
    if(!last||last.role!=="user"){renderFeed();return;}
    var text=last.content;convo.messages.pop();
    var inp=document.getElementById("zInput");inp.value=text;zSendMsg();};
  function flash(msg){var f=document.getElementById("zFlash");if(!f){f=document.createElement("div");f.id="zFlash";
    f.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel);"
    +"border:1px solid var(--line2);color:var(--ink);padding:9px 16px;border-radius:11px;font-size:13px;z-index:80;"
    +"box-shadow:var(--shadow);transition:opacity .2s";document.body.appendChild(f);}
    f.textContent=msg;f.style.opacity="1";clearTimeout(f._t);f._t=setTimeout(function(){f.style.opacity="0";},1600);}
  window.zFlash=flash;

  // feature flags (internal)
  var FLAGS={zcompact:"Compact density",zlarge:"Larger text"};
  function loadFlags(){try{return JSON.parse(localStorage.getItem("zeroFlags")||"{}");}catch(e){return {};}}
  function applyFlags(){var f=loadFlags();Object.keys(FLAGS).forEach(function(k){document.body.classList.toggle(k,!!f[k]);});}
  window.zToggleFlags=function(){var p=document.getElementById("zPop");p.classList.toggle("on");buildFlags();};
  window.zSetFlag=function(k){var f=loadFlags();f[k]=!f[k];localStorage.setItem("zeroFlags",JSON.stringify(f));applyFlags();buildFlags();};
  function buildFlags(){var f=loadFlags();document.getElementById("zPop").innerHTML=
    '<div class="ztitle">Internal flags</div>'+Object.keys(FLAGS).map(function(k){
      return '<div class="zflag'+(f[k]?' on':'')+'" onclick="zSetFlag(\''+k+'\')"><span>'+FLAGS[k]+'</span><span class="zsw"></span></div>';
    }).join("");}
  applyFlags();

  function scrollDown(){var s=document.getElementById("zScroll");s.scrollTop=s.scrollHeight;}

  // composer autosize + enable
  var input=document.getElementById("zInput"), sendBtn=document.getElementById("zSend");
  input.addEventListener("input",function(){
    this.style.height="auto";this.style.height=Math.min(this.scrollHeight,180)+"px";
    sendBtn.disabled=!this.value.trim()||busy;});
  input.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();zSendMsg();}});

  // model
  fetch("/api/config").then(r=>r.json()).then(d=>{
    model=(d&&d.defaultModel)||"meta-llama/llama-3.3-70b-instruct:free";
  }).catch(()=>{model="meta-llama/llama-3.3-70b-instruct:free";});

  window.zSendMsg=async function(){
    var text=input.value.trim(); if(!text||busy)return;
    if(!convo)convo=newConvo();
    convo.messages.push({role:"user",content:text});
    if(convo.messages.length===1)convo.title=text.slice(0,42);
    input.value="";input.style.height="auto";sendBtn.disabled=true;
    var aMsg={role:"assistant",content:""}; convo.messages.push(aMsg);
    renderFeed(); persist();
    // typing indicator
    var bodies=document.querySelectorAll("#zFeed .zmsg .zbody");
    var aBody=bodies[bodies.length-1]; aBody.innerHTML='<span class="zdots"><span></span><span></span><span></span></span>';
    busy=true;
    try{
      var resp=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages:convo.messages.slice(0,-1).map(m=>({role:m.role,content:m.content})),
          model:model,persona:"default",stream:true})});
      if(!resp.ok){throw new Error("HTTP "+resp.status);}
      var reader=resp.body.getReader(),dec=new TextDecoder(),buf="",full="";
      while(true){
        var rd=await reader.read(); if(rd.done)break;
        buf+=dec.decode(rd.value,{stream:true});
        var lines=buf.split("\n"); buf=lines.pop();
        for(var i=0;i<lines.length;i++){
          var t=lines[i].trim(); if(t.slice(0,5)!=="data:")continue;
          var d=t.slice(5).trim(); if(!d||d==="[DONE]")continue;
          try{var p=JSON.parse(d);
            if(p.content){full+=p.content;aBody.innerHTML=mdRender(full);scrollDown();}
            if(p.error){aBody.innerHTML='<span class="zerr">'+esc(p.error)+'</span>';}
          }catch(e){}
        }
      }
      aMsg.content=full||"(no response)";
      if(!full)aBody.innerHTML='<span class="zerr">No content returned.</span>';
    }catch(e){
      aMsg.content=""; aBody.innerHTML='<span class="zerr">Error: '+esc(e.message)+'</span>';
    }
    busy=false; sendBtn.disabled=!input.value.trim(); persist();
  };

  // init
  convo=newConvo(); renderSide(); renderFeed();
})(); }
</script>
</body>
</html>
