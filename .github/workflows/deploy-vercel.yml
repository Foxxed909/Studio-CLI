name: Deploy Studio Stage

# Deploys web/ to the production Vercel project ("studio-cli-pro", foxxed909's projects)
# on every push to main that touches web/. Requires ONE repo secret:
#   VERCEL_TOKEN — create at https://vercel.com/account/tokens
# Org and project IDs are not secrets; they are pinned below.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-vercel.yml"]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_nnj5MNKwGpt3MY6YnuRulsMt
  VERCEL_PROJECT_ID: prj_c0s24Rq3Vt30OIVv452CUBnWk8fg

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Guard — secret present
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Create a token at vercel.com/account/tokens and add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Smoke-test production
        run: |
          node <<'NODE'
          const base = "https://studio-cli-pro.vercel.app";
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function expect(path, status, check) {
            let last = "no response";
            for (let attempt = 1; attempt <= 6; attempt++) {
              try {
                const response = await fetch(base + path, {
                  cache: "no-store",
                  redirect: "follow",
                  signal: AbortSignal.timeout(20_000),
                });
                const body = await response.text();
                last = `HTTP ${response.status}: ${body.slice(0, 300)}`;
                if (response.status === status) {
                  if (check) check(body);
                  console.log(`✓ ${path} -> ${status}`);
                  return;
                }
              } catch (error) {
                last = error?.message || String(error);
              }
              await sleep(2_000);
            }
            throw new Error(`Expected HTTP ${status} from ${path}; last result: ${last}`);
          }

          await expect("/api/health", 200, (body) => {
            const data = JSON.parse(body);
            if (data.ok !== true) throw new Error("health response did not contain ok=true");
          });
          await expect("/", 200);
          await expect("/dashboard.html", 200);
          await expect("/pricing.html", 200);
          await expect("/api/community/history", 200);
          await expect("/api/stripe/plan", 401);
          await expect("/api/feedback", 401);
          await expect("/api/computer/sessions", 403);
          NODE
