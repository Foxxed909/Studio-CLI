name: Migrate Studio Stage Env

on:
  push:
    branches: [main]
    paths: [".github/workflows/migrate-stage-env.yml"]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_nnj5MNKwGpt3MY6YnuRulsMt
  VERCEL_PROJECT_ID: prj_c0s24Rq3Vt30OIVv452CUBnWk8fg
  OLD_VERCEL_PROJECT_ID: prj_WpfiOqHI8bb3eco4jCzooal2hSRW

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy missing production app variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node <<'NODE'
          const token = process.env.VERCEL_TOKEN;
          const team = process.env.VERCEL_ORG_ID;
          const sourceProject = process.env.OLD_VERCEL_PROJECT_ID;
          const targetProject = process.env.VERCEL_PROJECT_ID;
          if (!token) throw new Error("VERCEL_TOKEN is missing");

          const allowed = new Set([
            "SUPABASE_URL",
            "SUPABASE_SERVICE_KEY",
            "OPENROUTER_API_KEY",
            "ANON_OPENROUTER_API_KEY",
            "STRIPE_SECRET_KEY",
            "STRIPE_WEBHOOK_SECRET",
            "STRIPE_PRICE_STARTER",
            "STRIPE_PRICE_PRO",
            "STRIPE_PRICE_DEV",
            "STRIPE_PRICE_MAX",
            "STRIPE_PRICE_ULTRA",
            "BETA_MAX_SEATS",
            "STUDIO_ADMIN_EMAILS",
            "STAGE_CODES",
            "STAGE_ALL_ACCESS_CODE",
            "ALLOW_REMOTE_KEY",
            "STUDIO_API_SECRET"
          ]);

          const api = async (path, init = {}) => {
            const response = await fetch("https://api.vercel.com" + path, {
              ...init,
              headers: {
                Authorization: "Bearer " + token,
                "Content-Type": "application/json",
                ...(init.headers || {}),
              },
            });
            const text = await response.text();
            let data = {};
            try { data = text ? JSON.parse(text) : {}; } catch {}
            if (!response.ok) {
              throw new Error(`Vercel API ${response.status} for ${path}: ${data.error?.message || text.slice(0, 200)}`);
            }
            return data;
          };

          const source = await api(`/v10/projects/${sourceProject}/env?teamId=${encodeURIComponent(team)}&decrypt=true`);
          const target = await api(`/v10/projects/${targetProject}/env?teamId=${encodeURIComponent(team)}&decrypt=false`);
          const sourceEnvs = source.envs || source || [];
          const targetEnvs = target.envs || target || [];

          const hasProduction = (entry) => Array.isArray(entry.target) && entry.target.includes("production");
          const existing = new Set(targetEnvs.filter(hasProduction).map((entry) => entry.key));
          const candidates = sourceEnvs.filter((entry) =>
            allowed.has(entry.key) && hasProduction(entry) && typeof entry.value === "string" && entry.value.length > 0
          );

          let copied = 0;
          for (const entry of candidates) {
            if (existing.has(entry.key)) {
              console.log(`keep existing: ${entry.key}`);
              continue;
            }
            await api(`/v10/projects/${targetProject}/env?teamId=${encodeURIComponent(team)}&upsert=true`, {
              method: "POST",
              body: JSON.stringify({
                key: entry.key,
                value: entry.value,
                type: entry.type === "sensitive" ? "sensitive" : "encrypted",
                target: ["production"],
                comment: "Migrated from legacy Studio Stage Vercel project",
              }),
            });
            console.log(`copied missing: ${entry.key}`);
            copied++;
          }

          const required = ["SUPABASE_URL", "SUPABASE_SERVICE_KEY"];
          const now = new Set([...existing, ...candidates.map((entry) => entry.key)]);
          const missing = required.filter((key) => !now.has(key));
          if (missing.length) {
            throw new Error("Required production variables are still unavailable: " + missing.join(", "));
          }
          console.log(`migration complete: ${copied} variable(s) copied`);
          NODE

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull corrected production settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Redeploy Studio Stage
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
