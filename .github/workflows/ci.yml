name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Compile Python sources
        run: python -m compileall -q aistudio.py studio

      - name: Run test suite
        run: python test_studio.py

      - name: Validate Termux setup script syntax
        if: runner.os == 'Linux'
        run: bash -n termux_setup.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Stage dependencies
        run: npm install --prefix web --ignore-scripts

      - name: Validate Stage JavaScript
        run: |
          node --check web/server.js
          node --check web/public/studio-extras.js
          node --check web/public/service-worker.js
          node --check web/public/extension/background.js
          node --check web/public/extension/popup.js

      - name: Run Stage production smoke checks
        run: node web/smoke-test.mjs

      - name: Audit Stage production dependencies
        run: npm audit --omit=dev --prefix web
