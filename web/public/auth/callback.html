<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Signing in — Studio Stage</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#0d0d0d;color:#ececec}
body{display:flex;align-items:center;justify-content:center}
.bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 50% at 50% 40%,rgba(25,195,125,.07) 0%,transparent 70%)}
.card{position:relative;z-index:1;width:100%;max-width:420px;padding:0 20px;text-align:center}
h1{font-size:24px;font-weight:700;letter-spacing:-.03em;margin-bottom:10px}
.sub{font-size:14px;color:rgba(255,255,255,.5);line-height:1.55;margin-bottom:24px}
.token-box{display:none;background:#161616;border:1px solid rgba(255,255,255,.12);border-radius:12px;
  padding:14px;font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;
  max-height:120px;overflow:auto;text-align:left;color:#8be3b8;margin-bottom:12px}
.copy-btn{display:none;width:100%;padding:13px 16px;background:#19c37d;border:none;border-radius:12px;
  color:#06281a;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  transition:filter .15s}
.copy-btn:hover{filter:brightness(1.08)}
.spinner{width:28px;height:28px;margin:0 auto 20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.12);border-top-color:#19c37d;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none;border-top-color:rgba(255,255,255,.4)}}
.err{color:#f87171}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="card">
  <div class="spinner" id="spin"></div>
  <h1 id="title">Signing you in…</h1>
  <p class="sub" id="sub">Completing authentication with Studio Stage.</p>
  <div class="token-box" id="tokenBox"></div>
  <button class="copy-btn" id="copyBtn">Copy token for Studio CLI</button>
</div>
<script>
const SUPABASE_URL  = "https://yhranfhtggpzgadsyctw.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlocmFuZmh0Z2dwemdhZHN5Y3R3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMzgwMzEsImV4cCI6MjA5NDcxNDAzMX0.Vdp5b706jsbHAQkF5mVu1NUEA6QKs07OiX3o6GxFAnQ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

function fail(msg) {
  document.getElementById("spin").style.display = "none";
  document.getElementById("title").textContent = "Sign-in failed";
  const sub = document.getElementById("sub");
  sub.textContent = msg + " — go back and try again.";
  sub.classList.add("err");
}

(async () => {
  // supabase-js parses the OAuth hash automatically (detectSessionInUrl)
  for (let i = 0; i < 20; i++) {
    const { data } = await sb.auth.getSession();
    if (data && data.session) return done(data.session);
    await new Promise(r => setTimeout(r, 250));
  }
  fail("No session found");
})();

function done(session) {
  document.getElementById("spin").style.display = "none";
  const cliMode = sessionStorage.getItem("studio_cli_login") === "1";
  if (!cliMode) {
    document.getElementById("title").textContent = "Signed in ✓";
    document.getElementById("sub").textContent = "Taking you to Studio Stage…";
    setTimeout(() => location.replace("/index.html"), 700);
    return;
  }
  sessionStorage.removeItem("studio_cli_login");
  document.getElementById("title").textContent = "Signed in ✓ — connect your CLI";
  document.getElementById("sub").textContent =
    "Paste this token into the terminal where /login is waiting. It expires in about an hour; the CLI stores your account, not the token.";
  const box = document.getElementById("tokenBox");
  box.textContent = session.access_token;
  box.style.display = "block";
  const btn = document.getElementById("copyBtn");
  btn.style.display = "block";
  btn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(session.access_token);
      btn.textContent = "Copied ✓";
    } catch {
      box.focus();
      btn.textContent = "Copy failed — select the text above";
    }
  });
}
</script>
</body>
</html>
