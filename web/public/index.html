<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>StudioCLI</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github-dark.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#343541;color:#ececec;overflow:hidden}

/* Layout */
.app{display:flex;flex-direction:column;height:100vh}

/* Header */
.header{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);
  text-align:center;font-size:15px;font-weight:600;color:#ececec;
  background:#343541;flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.header-title{flex:1;text-align:center}
.header-actions{display:flex;gap:6px}
.ib{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.5);
  padding:6px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s}
.ib:hover{background:rgba(255,255,255,.08);color:#ececec}
.ib svg{width:16px;height:16px}

/* Chat window */
.chat{flex:1;overflow-y:auto;padding:24px 16px 8px;display:flex;flex-direction:column;gap:20px}
.chat::-webkit-scrollbar{width:6px}
.chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}

/* Messages */
.msg-row{display:flex}
.msg-row.user{justify-content:flex-end}
.msg-row.assistant{justify-content:flex-start}
.bubble{max-width:min(680px,80%);padding:12px 18px;border-radius:18px;
  font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg-row.user .bubble{background:#40414f;border-radius:18px 18px 4px 18px}
.msg-row.assistant .bubble{background:transparent;padding:4px 0;max-width:min(720px,90%)}
.bubble b{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.45);
  margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}

/* Markdown in AI messages */
.bubble p{margin-bottom:10px}
.bubble p:last-child{margin-bottom:0}
.bubble h1{font-size:20px;margin:16px 0 8px}
.bubble h2{font-size:17px;margin:14px 0 7px}
.bubble h3{font-size:15px;margin:12px 0 6px}
.bubble ul,.bubble ol{padding-left:20px;margin-bottom:10px}
.bubble li{margin-bottom:3px}
.bubble code{background:rgba(255,255,255,.1);border-radius:4px;padding:2px 5px;
  font-size:13px;font-family:'Fira Code','Cascadia Code',monospace}
.bubble pre{background:#0d0d0d;border-radius:8px;overflow:hidden;margin:10px 0;
  border:1px solid rgba(255,255,255,.1)}
.code-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:7px 14px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.1);
  font-size:12px;color:rgba(255,255,255,.5)}
.cpbtn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.5);
  font-size:12px;padding:2px 8px;border-radius:4px;transition:background .15s,color .15s}
.cpbtn:hover{background:rgba(255,255,255,.08);color:#ececec}
.bubble pre code{background:none;padding:14px;display:block;font-size:13px;overflow-x:auto}
.bubble blockquote{border-left:3px solid #19c37d;padding-left:14px;
  color:rgba(255,255,255,.6);margin:8px 0}
.bubble table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}
.bubble th,.bubble td{border:1px solid rgba(255,255,255,.1);padding:8px 12px;text-align:left}
.bubble th{background:rgba(255,255,255,.04);font-weight:600}
.bubble a{color:#19c37d;text-decoration:none}
.bubble a:hover{text-decoration:underline}

/* Typing indicator */
.typing{display:flex;gap:4px;padding:4px 0;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);
  animation:bounce 1.2s ease infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.cursor{display:inline-block;width:2px;height:1em;background:#ececec;
  vertical-align:middle;animation:blink 1s step-end infinite;margin-left:1px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Input area */
.inp-area{padding:12px 16px 20px;flex-shrink:0;
  background:linear-gradient(to top,#343541 60%,transparent)}
.inp-wrap{max-width:720px;margin:0 auto}
.inp-box{display:flex;align-items:center;background:#40414f;
  border-radius:14px;padding:10px 12px;gap:10px;
  border:1px solid rgba(255,255,255,.1);
  transition:border-color .15s,box-shadow .15s}
.inp-box:focus-within{border-color:rgba(25,195,125,.35);
  box-shadow:0 0 0 3px rgba(25,195,125,.08)}
#cin{flex:1;background:none;border:none;outline:none;color:#ececec;
  font-size:15px;line-height:1.5;resize:none;min-height:24px;max-height:180px;
  overflow-y:auto;padding:0;font-family:inherit}
#cin::placeholder{color:rgba(255,255,255,.35)}
.send{width:34px;height:34px;border-radius:8px;background:#19c37d;border:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s,transform .1s;flex-shrink:0;color:#fff}
.send:hover{background:#1a8e5f}
.send:active{transform:scale(.92)}
.send:disabled{background:rgba(255,255,255,.1);cursor:not-allowed}
.send svg{width:16px;height:16px}
.inp-foot{text-align:center;font-size:11px;color:rgba(255,255,255,.3);
  margin-top:8px;padding:0 4px}

/* Model selector */
.model-sel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:8px;padding:4px 10px;color:#ececec;font-size:13px;cursor:pointer;
  outline:none;transition:border-color .15s}
.model-sel:focus{border-color:rgba(25,195,125,.4)}
.model-sel option{background:#2f2f2f;color:#ececec}

/* Empty state */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:40px 20px;text-align:center;gap:8px}
.empty-title{font-size:28px;font-weight:600}
.empty-sub{font-size:14px;color:rgba(255,255,255,.4);margin-bottom:16px}

/* No-key banner */
.banner{display:none;align-items:center;gap:8px;margin:0 auto 10px;max-width:720px;
  background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);
  border-radius:8px;padding:9px 14px;font-size:13px;color:rgba(255,255,255,.7)}
.banner.on{display:flex}
.banner a{color:#ef4444;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div style="width:80px"></div>
    <div class="header-title">StudioCLI</div>
    <div class="header-actions">
      <select class="model-sel" id="msel" title="Model"></select>
    </div>
  </div>

  <!-- Chat window -->
  <div class="chat" id="chat">
    <div class="empty" id="empty">
      <div class="empty-title">What can I help with?</div>
      <div class="empty-sub">Powered by OpenRouter · free models available</div>
    </div>
  </div>

  <!-- Input -->
  <div class="inp-area">
    <div class="inp-wrap">
      <div class="banner" id="banner">
        No API key — free models only.&nbsp;<a onclick="openKey()">Add key →</a>
      </div>
      <div class="inp-box">
        <textarea id="cin" placeholder="Send a message…" rows="1"></textarea>
        <button class="send" id="send" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
      <div class="inp-foot">AI can make mistakes. Check important info.</div>
    </div>
  </div>

</div>

<script>
const FREE_MODELS=[
  {id:"nvidia/nemotron-3-super-120b-a12b:free",name:"Nemotron 120B"},
  {id:"openai/gpt-oss-120b:free",name:"GPT OSS 120B"},
  {id:"openai/gpt-oss-20b:free",name:"GPT OSS 20B"},
  {id:"meta-llama/llama-3.3-70b-instruct:free",name:"Llama 3.3 70B"},
  {id:"google/gemma-3-27b-it:free",name:"Gemma 3 27B"},
  {id:"qwen/qwen3-coder:free",name:"Qwen3 Coder"},
];
const PAID_MODELS=[
  {id:"openai/gpt-4o",name:"GPT-4o"},
  {id:"openai/gpt-4o-mini",name:"GPT-4o Mini"},
  {id:"anthropic/claude-sonnet-4-5",name:"Claude Sonnet"},
  {id:"anthropic/claude-opus-4-5",name:"Claude Opus"},
  {id:"google/gemini-2.5-pro",name:"Gemini 2.5 Pro"},
  {id:"mistralai/mistral-large",name:"Mistral Large"},
];

let messages=[];
let busy=false;
let model=FREE_MODELS[0].id;

// Build model selector
const msel=document.getElementById("msel");
const og1=document.createElement("optgroup");og1.label="Free";
FREE_MODELS.forEach(m=>{const o=new Option(m.name,m.id);og1.appendChild(o);});
const og2=document.createElement("optgroup");og2.label="Paid (key required)";
PAID_MODELS.forEach(m=>{const o=new Option(m.name,m.id);og2.appendChild(o);});
msel.appendChild(og1);msel.appendChild(og2);
msel.addEventListener("change",()=>{model=msel.value;});

// Check key on load
(async()=>{
  try{
    const c=await fetch("/api/config").then(r=>r.json());
    if(!c.hasKey)document.getElementById("banner").classList.add("on");
  }catch{}
})();

// Input auto-grow
const cin=document.getElementById("cin");
const send=document.getElementById("send");
cin.addEventListener("input",()=>{
  cin.style.height="auto";
  cin.style.height=Math.min(cin.scrollHeight,180)+"px";
  send.disabled=!cin.value.trim()||busy;
});
cin.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(!send.disabled)doSend();}
});
send.addEventListener("click",doSend);

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function md(text){
  if(!text)return"";
  marked.setOptions({breaks:true,gfm:true});
  const r=new marked.Renderer();
  r.code=function(code,lang){
    const l=lang||"plaintext",id="cb"+Math.random().toString(36).slice(2);
    let hi;
    try{hi=hljs.getLanguage(l)?hljs.highlight(code,{language:l}).value:hljs.highlightAuto(code).value;}
    catch{hi=esc(code);}
    return`<div><div class="code-hdr"><span>${l}</span><button class="cpbtn" onclick="cp('${id}')">Copy</button></div><pre><code id="${id}" class="hljs">${hi}</code></pre></div>`;
  };
  return marked.parse(text,{renderer:r});
}
function cp(id){
  const e=document.getElementById(id);if(!e)return;
  navigator.clipboard.writeText(e.textContent).then(()=>{
    const b=e.closest("div").querySelector(".cpbtn");
    if(b){b.textContent="Copied!";setTimeout(()=>b.textContent="Copy",2000);}
  });
}

function addMsg(role,content){
  document.getElementById("empty").style.display="none";
  const chat=document.getElementById("chat");
  const row=document.createElement("div");
  row.className="msg-row "+role;
  const bub=document.createElement("div");
  bub.className="bubble";
  const label=document.createElement("b");
  label.textContent=role==="user"?"You":"AI";
  bub.appendChild(label);
  if(role==="user"){
    const t=document.createElement("span");
    t.textContent=content;
    bub.appendChild(t);
  }else{
    const body=document.createElement("div");
    body.innerHTML=md(content);
    bub.appendChild(body);
  }
  row.appendChild(bub);
  chat.appendChild(row);
  chat.scrollTop=chat.scrollHeight;
  return bub;
}

async function doSend(){
  const text=cin.value.trim();
  if(!text||busy)return;
  busy=true;
  cin.value="";cin.style.height="auto";send.disabled=true;
  messages.push({role:"user",content:text});
  addMsg("user",text);

  // Thinking indicator
  document.getElementById("empty").style.display="none";
  const chat=document.getElementById("chat");
  const thinkRow=document.createElement("div");
  thinkRow.className="msg-row assistant";
  thinkRow.innerHTML=`<div class="bubble"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  chat.appendChild(thinkRow);
  chat.scrollTop=chat.scrollHeight;

  try{
    const resp=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages,model,stream:true}),
    });

    thinkRow.remove();

    if(!resp.ok){
      const e=await resp.json().catch(()=>({message:resp.statusText}));
      if(e.error==="no_key")document.getElementById("banner").classList.add("on");
      const row=document.createElement("div");row.className="msg-row assistant";
      row.innerHTML=`<div class="bubble" style="color:#ef4444">Error: ${esc(e.message||resp.statusText)}</div>`;
      chat.appendChild(row);chat.scrollTop=chat.scrollHeight;
      return;
    }

    // Streaming
    const aRow=document.createElement("div");aRow.className="msg-row assistant";
    const aBub=document.createElement("div");aBub.className="bubble";
    const aLabel=document.createElement("b");aLabel.textContent="AI";
    const aBody=document.createElement("div");
    aBody.innerHTML=`<span class="cursor"></span>`;
    aBub.appendChild(aLabel);aBub.appendChild(aBody);
    aRow.appendChild(aBub);chat.appendChild(aRow);

    const reader=resp.body.getReader(),dec=new TextDecoder();
    let buf="",full="";
    while(true){
      const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split("\n");buf=lines.pop();
      for(const line of lines){
        const t=line.trim();if(!t.startsWith("data: "))continue;
        const data=t.slice(6);if(data==="[DONE]")break;
        try{
          const p=JSON.parse(data);
          if(p.content){full+=p.content;aBody.innerHTML=md(full)+`<span class="cursor"></span>`;}
          if(p.error){aBody.innerHTML=`<span style="color:#ef4444">Error: ${esc(p.error)}</span>`;break;}
        }catch{}
      }
      chat.scrollTop=chat.scrollHeight;
    }
    aBody.innerHTML=md(full)||`<em style="color:rgba(255,255,255,.4)">No response</em>`;
    messages.push({role:"assistant",content:full});

  }catch(e){
    thinkRow.remove();
    const row=document.createElement("div");row.className="msg-row assistant";
    row.innerHTML=`<div class="bubble" style="color:#ef4444">Network error: ${esc(e.message)}</div>`;
    chat.appendChild(row);
  }finally{
    busy=false;
    send.disabled=!cin.value.trim();
    chat.scrollTop=chat.scrollHeight;
  }
}

function openKey(){
  const k=prompt("Enter your OpenRouter key (sk-or-…):");
  if(!k||!k.startsWith("sk-or-"))return;
  fetch("/api/key",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:k})})
    .then(r=>{if(r.ok)document.getElementById("banner").classList.remove("on");});
}
</script>
</body>
</html>
