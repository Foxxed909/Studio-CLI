name: Deploy Studio Stage

# Deploys web/ to the production Vercel project ("studio-cli-pro", foxxed909's projects)
# on every push to main that touches web/. Requires ONE repo secret:
#   VERCEL_TOKEN — create at https://vercel.com/account/tokens
# Org and project IDs are not secrets; they are pinned below.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-vercel.yml"]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_nnj5MNKwGpt3MY6YnuRulsMt
  VERCEL_PROJECT_ID: prj_c0s24Rq3Vt30OIVv452CUBnWk8fg

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Guard — secret present
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Create a token at vercel.com/account/tokens and add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Smoke-test production
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"

          vcurl() {
            local path="$1"
            local out="$2"
            vercel curl "$path" --deployment "$DEPLOYMENT_URL" -- --silent --show-error --output "$out"
          }

          vcurl "/api/health" /tmp/health.json
          node -e 'const d=require(process.argv[1]); if(d.ok!==true) process.exit(1)' /tmp/health.json

          vcurl "/" /tmp/root.html
          vcurl "/dashboard.html" /tmp/dashboard.html
          vcurl "/pricing.html" /tmp/pricing.html
          test -s /tmp/root.html
          test -s /tmp/dashboard.html
          test -s /tmp/pricing.html

          vcurl "/api/community/history" /tmp/community.json
          node -e 'const d=require(process.argv[1]); if(!Array.isArray(d.messages)) process.exit(1)' /tmp/community.json

          vcurl "/api/stripe/plan" /tmp/plan.json
          node -e 'const d=require(process.argv[1]); if(d.error!=="Not authenticated") process.exit(1)' /tmp/plan.json

          vcurl "/api/feedback" /tmp/feedback.json
          node -e 'const d=require(process.argv[1]); if(d.error!=="Not authenticated") process.exit(1)' /tmp/feedback.json

          vcurl "/api/computer/sessions" /tmp/computer.json
          node -e 'const d=require(process.argv[1]); if(d.error!=="Forbidden") process.exit(1)' /tmp/computer.json

          echo "✓ production smoke checks passed for $DEPLOYMENT_URL"
