name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Compile Python sources
        run: python -m compileall -q aistudio.py studio

      - name: Run test suite
        run: python test_studio.py

      - name: Validate Termux setup script syntax
        if: runner.os == 'Linux'
        run: bash -n termux_setup.sh
