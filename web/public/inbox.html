<!DOCTYPE html>
<html lang="en" data-zero-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox — StudioCLI Internal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[data-zero-theme="dark"]{--bg:#0a0a0b;--panel:#141416;--panel2:#1a1a1d;--ink:#ededee;--ink2:#a1a1a8;
  --ink3:#6b6b73;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--hover:rgba(255,255,255,.05);
  --shadow:0 16px 50px rgba(0,0,0,.55)}
[data-zero-theme="light"]{--bg:#faf9f7;--panel:#fff;--panel2:#f3f1ed;--ink:#16161a;--ink2:#5b5b63;
  --ink3:#9a9aa2;--line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.14);--hover:rgba(0,0,0,.045);
  --shadow:0 16px 50px rgba(0,0,0,.12)}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100vh;font-size:15px;line-height:1.6}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-weight:800;display:flex;gap:9px;align-items:center}
.mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:flex;
  align-items:center;justify-content:center;font-weight:800}
.tools{display:flex;gap:8px}
.btn{background:none;border:1px solid var(--line2);color:var(--ink2);border-radius:999px;padding:7px 14px;
  font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.btn:hover{color:var(--ink);border-color:var(--ink2)}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:26px 20px 80px}
h1{font-size:24px;margin-bottom:2px}
.sub{color:var(--ink2);font-size:13.5px;margin-bottom:6px}
.filters{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;
  color:var(--ink2);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-bottom:11px;
  display:flex;gap:13px;align-items:flex-start}
.item.unread{border-color:var(--line2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink);margin-top:8px;flex-shrink:0;opacity:0}
.item.unread .dot{opacity:1}
.body{flex:1;min-width:0}
.meta{display:flex;align-items:center;gap:9px;margin-bottom:5px;flex-wrap:wrap}
.kind{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;padding:2px 8px;border-radius:6px}
.kind.bug{background:rgba(248,113,113,.16);color:#f87171}
.kind.idea{background:rgba(34,211,238,.16);color:#22d3ee}
.kind.praise{background:rgba(74,222,128,.16);color:#4ade80}
.kind.other{background:var(--hover);color:var(--ink2)}
.when{font-size:12px;color:var(--ink3)}
.who{font-size:12px;color:var(--ink3)}
.msg{font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.rd{background:none;border:0;color:var(--ink3);cursor:pointer;font-size:12px;flex-shrink:0}
.rd:hover{color:var(--ink)}
.empty{text-align:center;color:var(--ink3);padding:60px 0}
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;padding:24px}
.gbox{max-width:440px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:38px 30px}
.gbox input{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;color:var(--ink);padding:11px 13px;font:inherit;width:190px;outline:0}
.gbox button{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<script>
function stageToken(){
  try{
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(key && key.startsWith("sb-") && key.endsWith("-auth-token")){
        const value=JSON.parse(localStorage.getItem(key));
        return value?.access_token || value?.currentSession?.access_token || null;
      }
    }
  }catch{}
  return null;
}
window.INBOX_TOKEN = stageToken();
document.documentElement.setAttribute("data-zero-theme", localStorage.getItem("zeroTheme")||"dark");
</script>

<header>
  <div class="logo"><div class="mark">0</div> Inbox <span style="color:var(--ink3);font-size:12px;font-weight:500">internal</span></div>
  <div class="tools">
    <button class="btn" id="unreadBtn" onclick="markAll()">Mark all read</button>
    <button class="btn" onclick="load()">Refresh</button>
    <a class="btn" href="/index.html">Studio</a>
  </div>
</header>
<main>
  <h1>Feedback inbox</h1>
  <p class="sub" id="sub">Loading…</p>
  <div class="filters" id="filters">
    <span class="chip on" data-k="all" onclick="setFilter(this)">All</span>
    <span class="chip" data-k="bug" onclick="setFilter(this)">🐞 Bugs</span>
    <span class="chip" data-k="idea" onclick="setFilter(this)">💡 Ideas</span>
    <span class="chip" data-k="praise" onclick="setFilter(this)">💚 Praise</span>
    <span class="chip" data-k="other" onclick="setFilter(this)">Other</span>
    <span class="chip" data-k="unread" onclick="setFilter(this)">● Unread</span>
  </div>
  <div id="list"></div>
</main>

<script>
if(!window.INBOX_TOKEN){
  document.body.innerHTML='<div class="gate"><div class="gbox">'
    +'<div style="font-size:30px;margin-bottom:10px">📥</div>'
    +'<h2 style="margin-bottom:10px;font-size:20px">Internal inbox</h2>'
    +'<p style="color:var(--ink2);margin-bottom:18px;font-size:14px">Sign in with an authorized Studio admin account to continue.</p>'
    +'<a class="btn solid" href="/login.html?next=%2Finbox.html">Sign in</a>'
    +'<div style="margin-top:16px"><a href="/index.html" style="color:var(--ink3);font-size:13px">← Back to Studio</a></div></div></div>';
}else{
  var ITEMS=[], FILTER="all";
  var HEADERS={"Authorization":"Bearer "+window.INBOX_TOKEN};
  function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
  function ago(ts){var s=(Date.now()-ts)/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+"m ago";
    if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago";}
  window.setFilter=function(el){FILTER=el.getAttribute("data-k");
    document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===el));render();};
  function render(){
    var list=document.getElementById("list");
    var items=ITEMS.filter(it=>FILTER==="all"?true:FILTER==="unread"?!it.read:it.kind===FILTER);
    if(!items.length){list.innerHTML='<div class="empty">No feedback'+(FILTER!=="all"?" in this view":" yet")+'.</div>';return;}
    list.innerHTML=items.map(it=>
      '<div class="item'+(it.read?'':' unread')+'"><div class="dot"></div><div class="body">'
      +'<div class="meta"><span class="kind '+it.kind+'">'+it.kind+'</span>'
      +'<span class="when">'+ago(it.ts)+'</span>'
      +(it.email?'<span class="who">· '+esc(it.email)+'</span>':'')
      +(it.page?'<span class="who">· '+esc(it.page)+'</span>':'')+'</div>'
      +'<div class="msg">'+esc(it.message)+'</div></div>'
      +(it.read?'':'<button class="rd" onclick="markRead(\''+it.id+'\')">Mark read</button>')+'</div>').join("");
  }
  window.markRead=function(id){fetch("/api/feedback/read",{method:"POST",
    headers:Object.assign({"Content-Type":"application/json"},HEADERS),body:JSON.stringify({id:id})})
    .then(r=>{if(!r.ok)throw new Error(String(r.status));return r.json();})
    .then(()=>{var it=ITEMS.find(x=>x.id===id);if(it)it.read=true;updSub();render();})
    .catch(()=>{document.getElementById("sub").textContent="Could not update feedback.";});};
  window.markAll=function(){fetch("/api/feedback/read",{method:"POST",
    headers:Object.assign({"Content-Type":"application/json"},HEADERS),body:JSON.stringify({all:true})})
    .then(r=>{if(!r.ok)throw new Error(String(r.status));return r.json();})
    .then(()=>{ITEMS.forEach(x=>x.read=true);updSub();render();})
    .catch(()=>{document.getElementById("sub").textContent="Could not update feedback.";});};
  function updSub(){var u=ITEMS.filter(x=>!x.read).length;
    document.getElementById("sub").textContent=ITEMS.length+" message"+(ITEMS.length!==1?"s":"")+" · "+u+" unread";
    document.getElementById("unreadBtn").textContent=u?("Mark all read ("+u+")"):"All read";}
  window.load=function(){
    fetch("/api/feedback",{headers:HEADERS}).then(async r=>{
      if(r.ok)return r.json();
      if(r.status===401)throw new Error("Sign in required");
      if(r.status===403)throw new Error("Admin access required");
      throw new Error("HTTP "+r.status);
    })
      .then(d=>{ITEMS=d.items||[];updSub();render();})
      .catch(e=>{document.getElementById("sub").textContent=e.message||"Could not load inbox.";
        document.getElementById("list").innerHTML='<div class="empty">Access denied or the inbox service is unavailable.</div>';});
  };
  load();
}
</script>
</body>
</html>
