<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:270px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#131211;color:#f0ede8;padding:14px}

.logo{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.logo-mark{width:26px;height:26px;border-radius:7px;background:#f0ede8;color:#131211;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;
  position:relative;flex-shrink:0}
.logo-mark::after{content:"";position:absolute;inset:0;border-radius:7px;
  background:linear-gradient(135deg,transparent 55%,#d97757 55%);mix-blend-mode:screen;opacity:.85}
.logo-name{font-size:14px;font-weight:600;letter-spacing:-.01em}
.badge{font-size:9px;font-weight:700;background:#d97757;color:#fff;
  padding:1px 5px;border-radius:4px;margin-left:4px;letter-spacing:.04em;text-transform:uppercase}

.status-row{display:flex;align-items:center;gap:7px;padding:9px 10px;
  background:#1f1c19;border:1px solid rgba(240,232,220,.08);border-radius:9px;margin-bottom:8px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot.on{background:#7fb685;box-shadow:0 0 0 3px rgba(127,182,133,.2)}
.dot.off{background:rgba(240,232,220,.25)}
.status-text{font-size:12px;color:rgba(240,237,232,.62);flex:1}
.session-id{font-size:9px;font-family:monospace;color:rgba(240,237,232,.28)}

.tab-info{font-size:10px;color:rgba(240,237,232,.35);margin:0 0 8px 2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.server-status{font-size:10px;color:rgba(240,237,232,.35);margin:0 0 10px 2px}

.field{margin-bottom:9px}
.field label{display:block;font-size:10.5px;color:rgba(240,237,232,.4);margin-bottom:3px;
  text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.field input,.field select{width:100%;background:#1f1c19;border:1px solid rgba(240,232,220,.08);
  border-radius:7px;padding:6px 9px;color:#f0ede8;font-size:12px;outline:none;font-family:inherit}
.field input:focus,.field select:focus{border-color:rgba(217,119,87,.4);box-shadow:0 0 0 3px rgba(217,119,87,.1)}

.btn-row{display:flex;gap:7px;margin-bottom:7px}
.btn{flex:1;border:none;border-radius:8px;padding:9px 10px;font-size:12.5px;
  font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-start{background:#d97757;color:#fff}
.btn-start:hover{background:#c46341}
.btn-stop{background:#1f1c19;color:rgba(240,237,232,.62);border:1px solid rgba(240,232,220,.14);flex:2}
.btn-stop:hover{background:#262320;color:#f0ede8}
.btn-sm{flex:0;padding:9px 12px;background:#1f1c19;color:rgba(240,237,232,.55);
  border:1px solid rgba(240,232,220,.12);border-radius:8px;white-space:nowrap;font-size:11px}
.btn-sm:hover{background:#262320;color:#f0ede8}

.divider{height:1px;background:rgba(240,232,220,.07);margin:9px 0}

.log{font-size:10px;color:rgba(240,237,232,.4);line-height:1.55;
  max-height:90px;overflow-y:auto;font-family:monospace}
.log::-webkit-scrollbar{width:2px}
.log::-webkit-scrollbar-thumb{background:rgba(240,232,220,.14);border-radius:1px}

.tip{font-size:10px;color:rgba(240,237,232,.24);margin-top:10px;line-height:1.5;text-align:center}
</style>
</head>
<body>
<div class="logo">
  <div class="logo-mark">S</div>
  <span class="logo-name">StudioCLI<span class="badge">Computer</span></span>
</div>

<div class="status-row">
  <div class="dot off" id="dot"></div>
  <div style="flex:1;min-width:0">
    <div class="status-text" id="statusText">Inactive</div>
    <div class="session-id" id="sessionId"></div>
  </div>
</div>

<div class="tab-info" id="tabInfo">—</div>
<div class="server-status" id="serverStatus"></div>

<div class="field">
  <label>Studio URL</label>
  <input id="urlInput" value="http://localhost:3456" placeholder="http://localhost:3456"/>
</div>

<div class="field">
  <label>Screenshot quality</label>
  <select id="quality">
    <option value="30">Low (30%) — fastest</option>
    <option value="60" selected>Medium (60%)</option>
    <option value="80">High (80%)</option>
    <option value="90">Max (90%) — sharpest</option>
  </select>
</div>

<div class="btn-row">
  <button class="btn btn-start" id="btnStart">▶ Start</button>
  <button class="btn btn-stop" id="btnStop" style="display:none">■ Stop</button>
  <button class="btn btn-sm" id="btnCapture" title="Capture current tab now">⟳</button>
</div>

<div class="divider"></div>
<div class="log" id="log"></div>

<p class="tip">Open StudioCLI → Computer to control this tab with AI.</p>

<script src="popup.js"></script>
</body>
</html>
