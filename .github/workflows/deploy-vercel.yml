name: Deploy Studio Stage

# Deploys web/ to the production Vercel project ("studio-cli-pro", foxxed909's projects)
# on every push to main that touches web/. Requires ONE repo secret:
#   VERCEL_TOKEN — create at https://vercel.com/account/tokens
# Org and project IDs are not secrets; they are pinned below.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-vercel.yml"]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_nnj5MNKwGpt3MY6YnuRulsMt
  VERCEL_PROJECT_ID: prj_c0s24Rq3Vt30OIVv452CUBnWk8fg

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Guard — secret present
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Create a token at vercel.com/account/tokens and add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Smoke-test production
        shell: bash
        run: |
          set -euo pipefail
          base="https://studio-cli-pro.vercel.app"

          health="$(curl -fsS --retry 5 --retry-delay 2 "$base/api/health")"
          node -e 'const d=JSON.parse(process.argv[1]); if(!d.ok) process.exit(1)' "$health"

          expect_status() {
            local expected="$1"
            local url="$2"
            local actual
            actual="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 1 "$url")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Expected HTTP $expected from $url, got $actual"
              exit 1
            fi
          }

          expect_status 200 "$base/"
          expect_status 200 "$base/dashboard.html"
          expect_status 200 "$base/pricing.html"
          expect_status 200 "$base/api/community/history"
          expect_status 401 "$base/api/stripe/plan"
          expect_status 401 "$base/api/feedback"
          expect_status 403 "$base/api/computer/sessions"
