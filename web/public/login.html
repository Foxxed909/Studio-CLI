<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sign in — Studio Stage</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#0d0d0d;color:#ececec;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}

.bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 50% at 50% 40%,rgba(25,195,125,.07) 0%,transparent 70%)}

.card{position:relative;z-index:1;width:100%;max-width:380px;padding:0 20px}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:36px}
.logo-gem{width:36px;height:36px;border-radius:11px;
  background:linear-gradient(135deg,#19c37d,#0ea5e9);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-gem svg{width:16px;height:16px;stroke:#fff;fill:none}
.logo-text{font-size:20px;font-weight:700;letter-spacing:-.02em}
.logo-text span{color:#19c37d}

h1{font-size:24px;font-weight:700;letter-spacing:-.03em;text-align:center;margin-bottom:8px}
.sub{font-size:14px;color:rgba(255,255,255,.45);text-align:center;margin-bottom:32px;line-height:1.55}

.oauth-btn{width:100%;display:flex;align-items:center;gap:12px;padding:13px 16px;
  background:#1a1a1a;border:1px solid rgba(255,255,255,.1);border-radius:12px;
  color:#ececec;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;
  transition:background .15s,border-color .15s,transform .1s;margin-bottom:10px}
.oauth-btn:hover{background:#222;border-color:rgba(255,255,255,.2);transform:translateY(-1px)}
.oauth-btn:active{transform:translateY(0)}
.oauth-btn svg{width:20px;height:20px;flex-shrink:0}
.oauth-btn span{flex:1;text-align:left}
.oauth-btn .arrow{color:rgba(255,255,255,.3);font-size:16px}

.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:rgba(255,255,255,.2);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.08)}

.email-form{display:flex;flex-direction:column;gap:10px}
.email-input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:12px 14px;font-size:14px;color:#ececec;outline:none;font-family:inherit;
  transition:border-color .15s}
.email-input:focus{border-color:rgba(25,195,125,.45)}
.email-input::placeholder{color:rgba(255,255,255,.3)}
.magic-btn{width:100%;background:linear-gradient(135deg,#19c37d,#17a86b);border:none;
  border-radius:10px;padding:13px;font-size:14px;font-weight:600;color:#fff;
  cursor:pointer;font-family:inherit;transition:opacity .15s}
.magic-btn:hover{opacity:.88}
.magic-btn:disabled{opacity:.5;cursor:not-allowed}

.status{margin-top:16px;text-align:center;font-size:13px;color:rgba(255,255,255,.45);min-height:20px}
.status.success{color:#19c37d}
.status.error{color:#ef4444}

.terms{margin-top:28px;text-align:center;font-size:11.5px;color:rgba(255,255,255,.25);line-height:1.6}
.terms a{color:rgba(255,255,255,.4);text-decoration:none}
.terms a:hover{color:#ececec}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="card">
  <div class="logo">
    <div class="logo-gem">
      <svg viewBox="0 0 24 24" stroke-width="2.2"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5"/></svg>
    </div>
    <div class="logo-text">Studio <span>Stage</span></div>
  </div>

  <h1>Welcome back</h1>
  <p class="sub">Sign in to your account to continue.</p>

  <!-- Google -->
  <button class="oauth-btn" id="btnGoogle">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    <span>Continue with Google</span>
    <span class="arrow">→</span>
  </button>

  <!-- GitHub -->
  <button class="oauth-btn" id="btnGithub">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
    </svg>
    <span>Continue with GitHub</span>
    <span class="arrow">→</span>
  </button>

  <!-- Discord -->
  <button class="oauth-btn" id="btnDiscord">
    <svg viewBox="0 0 24 24" fill="#5865F2">
      <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.03.053a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
    </svg>
    <span>Continue with Discord</span>
    <span class="arrow">→</span>
  </button>

  <div class="divider">or</div>

  <div class="email-form">
    <input class="email-input" id="emailIn" type="email" placeholder="Email address" autocomplete="email"/>
    <button class="magic-btn" id="btnMagic">Send magic link</button>
  </div>

  <div class="status" id="status"></div>

  <p class="terms">By signing in you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
</div>

<script>
const SUPABASE_URL  = "https://yhranfhtggpzgadsyctw.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlocmFuZmh0Z2dwemdhZHN5Y3R3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMzgwMzEsImV4cCI6MjA5NDcxNDAzMX0.Vdp5b706jsbHAQkF5mVu1NUEA6QKs07OiX3o6GxFAnQ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const redirectTo = `${location.origin}/auth/callback.html`;
const nextPath = new URLSearchParams(location.search).get("next");
if(nextPath && nextPath.startsWith("/") && !nextPath.startsWith("//")) {
  sessionStorage.setItem("studio_login_next", nextPath);
}

// Studio CLI /login sends users here with ?cli=1 — the callback page then
// shows the access token to paste back into the terminal.
if (new URLSearchParams(location.search).get("cli") === "1") {
  sessionStorage.setItem("studio_cli_login", "1");
}

function setStatus(msg, type = "") {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status " + type;
}

function oauthBtn(id, provider) {
  document.getElementById(id).addEventListener("click", async () => {
    setStatus("Redirecting…");
    const { error } = await sb.auth.signInWithOAuth({ provider, options: { redirectTo } });
    if (error) setStatus(error.message, "error");
  });
}
oauthBtn("btnGoogle",  "google");
oauthBtn("btnGithub",  "github");
oauthBtn("btnDiscord", "discord");

document.getElementById("btnMagic").addEventListener("click", async () => {
  const email = document.getElementById("emailIn").value.trim();
  if (!email || !email.includes("@")) { setStatus("Enter a valid email.", "error"); return; }
  const btn = document.getElementById("btnMagic");
  btn.disabled = true; btn.textContent = "Sending…";
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectTo } });
  if (error) { setStatus(error.message, "error"); btn.disabled = false; btn.textContent = "Send magic link"; }
  else { setStatus("Magic link sent! Check your inbox ✓", "success"); }
});
</script>
</body>
</html>
