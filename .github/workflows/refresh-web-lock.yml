name: Refresh Stage Lockfile

on:
  push:
    branches: [main]
    paths: [".github/workflows/refresh-web-lock.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate reproducible Stage lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit production dependencies
        working-directory: web
        run: npm audit --omit=dev
      - name: Commit lockfile
        run: |
          git config user.name "Studio CI"
          git config user.email "actions@users.noreply.github.com"
          git add web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore(web): lock Stage dependencies"
          git push origin HEAD:main
